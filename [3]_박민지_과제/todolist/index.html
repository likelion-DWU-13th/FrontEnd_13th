<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo-list</title>
    <link rel="stylesheet" href="todo.css"> <!--css파일 연결-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"> <!--fontawesome-->
</head>

<body>
    <div class="container"> <!--전체를 포함하는 컨테이너 -->

        <div class="box1">
            <h1><i class="fa-solid fa-heart-circle-check">TO DO LIST</i></h1>
        </div> <!--box1: 제목-->
    
    
        <div class="box2">
             <form id="todo-form">
            &nbsp;&nbsp;&nbsp;&nbsp; <!--정렬css 안 먹음, 이렇게라도 가운데로-->
            <input type="text"  placeholder="I'm going to..." required/>
            <input type="submit" id="sub" value="press"/>
            </form>   

            <ul id="todo-list"></ul>
        </div><!--box2: 투두 입력 폼, press버튼, 입력된 값을 나열하는 ul-->

        <div class="box3">
             <button type="button" id="deleteAll">all delete</button>
        </div> <!--box3: all delete 버튼-->

    </div>

    <script src="todo.js"></script> <!--js 파일 연결-->
   
</body>
</html>
