<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css"/>
        <title>To Do List</title>
    </head>
    <body>
        <div class="hor">
            <div>
                <button type="button" class="button" id="prev-date">이전</button>
                <span id="current-date" style="font-size:40px"></span>
                <button type="button" class="button" id="next-date">다음</button>
            </div>
            
            <div>
                <input type="text" class="in" placeholder="write your to do!" id="todo-input">
            </div>
                <button type="button" class="add-button" id="add">add!</button>
        </div>
        <ul id="todo-list">
        </ul>
        <script type="text/javascript" src="script.js"/>
    </body>
</html>
