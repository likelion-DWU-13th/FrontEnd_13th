<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda+SC:ital,opsz,wght@0,6..96,700;1,6..96,700&family=Chonburi&display=swap" rel="stylesheet">
    <title>To do list</title>
</head>
<body>
    <div class="container">
        <div class="TodoTitle">
            <h1>To Do List</h1>
        </div>
        <div class="main">
            <form id="todo-form">
                <input type="text" id="TodoInput" placeholder="할 일을 입력하세요" required>
                <button type="button" id="addButton">추가</button>
            </form>
            <ul id="todo-list" input type="checkbox">
                 
            </ul>
        </div>
        <div class="AlldeleteBtn">
            <button id= "deleteButton">전체 삭제</button>
        </div>
    </div>
    <script src = "script.js"></script>
</body>
</html>
